[project]
name = "s2s-decode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.10.5", "orjson==3.11.9"]

[project.scripts]
s2s-decode = "s2s.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["s2s*"]
