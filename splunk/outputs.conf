# Forward Splunk traffic to Splash (s2s-decode / Logstash).
# Place under $SPLUNK_HOME/etc/system/local/ (or an app's local/).
#
# Single-stack defaults match docker compose published ports 39997 / 39998.
# For horizontal shards, use the multi-server stanzas (or autoLB list) below.

[tcpout]
defaultGroup = splash_cooked
# Prefer classic cooked framing so third-party terminators can decode reliably.
enableOldS2SProtocol = true

# ---------------------------------------------------------------------------
# Single stack (default compose)
# ---------------------------------------------------------------------------

# Plain (uncooked) raw lines -> Logstash TCP
[tcpout:splash_uncooked]
server = 127.0.0.1:39997
sendCookedData = false

# Cooked S2S binary -> s2s-decode TCP
[tcpout:splash_cooked]
server = 127.0.0.1:39998
sendCookedData = true
compressed = false
negotiateProtocolLevel = 0

# ---------------------------------------------------------------------------
# Horizontal shards (docker-compose.shard.yml / scripts/run-shard.sh)
#
# Port stride 10 on one host:
#   shard 0 → :39997 / :39998
#   shard 1 → :40007 / :40008
#   shard 2 → :40017 / :40018
#
# Replace 127.0.0.1 with the Splash host or VIP when forwarders are remote.
# Uncomment one of the groups below and set defaultGroup accordingly.
# ---------------------------------------------------------------------------

# [tcpout]
# defaultGroup = splash_cooked_shards

# [tcpout:splash_cooked_shards]
# server = 127.0.0.1:39998, 127.0.0.1:40008, 127.0.0.1:40018
# autoLBFrequency = 30
# sendCookedData = true
# compressed = false
# negotiateProtocolLevel = 0

# [tcpout:splash_uncooked_shards]
# server = 127.0.0.1:39997, 127.0.0.1:40007, 127.0.0.1:40017
# autoLBFrequency = 30
# sendCookedData = false

# Multi-host example (one pipeline stack per VM, same ports, private net):
# [tcpout:splash_cooked_shards]
# server = 10.0.1.10:39998, 10.0.1.11:39998, 10.0.1.12:39998
# autoLBFrequency = 30
# sendCookedData = true
# compressed = false
# negotiateProtocolLevel = 0
