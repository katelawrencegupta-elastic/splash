# Horizontal shard overlay for Splash.
#
# Each shard is a full compose project (own network, classify, logstash, s2s-decode)
# with host ports offset by SHARD_ID so many stacks can share one machine.
#
# Port map (default stride 10):
#   SHARD_ID=0 → uncooked 39997, cooked 39998, classify 8080, s2s health 8081, LS API 9600
#   SHARD_ID=1 → uncooked 40007, cooked 40008, classify 8090, s2s health 8091, LS API 9610
#
# Quick start:
#   ./scripts/run-shard.sh 0 up --build -d
#   ./scripts/run-shard.sh 1 up --build -d
#
# Splunk: see splunk/outputs.conf (multi-server cooked/uncooked examples).

services:
  classify:
    container_name: !reset null
    ports: !override
      - "${INGEST_BIND:-127.0.0.1}:${CLASSIFY_HOST_PORT:-8080}:8080"
  logstash:
    container_name: !reset null
    ports: !override
      - "${INGEST_BIND:-127.0.0.1}:${UNCOOKED_HOST_PORT:-39997}:39997"
      - "${INGEST_BIND:-127.0.0.1}:${LS_API_HOST_PORT:-9600}:9600"
  s2s-decode:
    container_name: !reset null
    ports: !override
      - "${INGEST_BIND:-127.0.0.1}:${COOKED_HOST_PORT:-39998}:39998"
      - "${INGEST_BIND:-127.0.0.1}:${S2S_HEALTH_HOST_PORT:-8081}:8081"
