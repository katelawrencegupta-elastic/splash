http.host: "0.0.0.0"
xpack.monitoring.enabled: false
# Helm templates pipeline.workers from values.pipeline.workers (default 4,
# matching Logstash CPU limit). This file is the chart source of truth for
# non-templated keys; workers is injected in templates/configmap.yaml.
pipeline.batch.size: 500
# Capture ES output failures (missing pipeline, mapping errors, …) instead of
# endless retries that back-pressure into Splunk.
dead_letter_queue.enable: true
dead_letter_queue.max_bytes: 1073741824
