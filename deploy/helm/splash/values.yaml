# Capacity: ~0.008–0.009 GB/s (~5k eps @ 1.5KB hot path) per pipeline replica.
# shards ≈ ceil(target_GBps / 0.008) * 1.25

nameOverride: ""
fullnameOverride: ""

elastic:
  host: ""
  apiKey: ""
  namespace: default
  httpTimeoutS: "2.0"
  ensureConcurrency: "8"

# require = production (pipelines must exist). stub = POC only.
frostyPipelineMode: require

classify:
  replicaCount: 2
  image: splash-classify:latest
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080

pipeline:
  # Each replica is one s2s-decode + Logstash pair (StatefulSet pod).
  replicaCount: 2
  s2sImage: splash-s2s-decode:latest
  logstashImage: splash-logstash:latest
  imagePullPolicy: IfNotPresent
  lsJavaOpts: "-Xms1g -Xmx1g"
  # Per-pod PVC for DLQ + classify_spill (survives reschedule).
  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteOnce
    storageClassName: ""
  resources:
    s2s:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
    logstash:
      requests:
        cpu: 500m
        memory: 1536Mi
      limits:
        cpu: "4"
        memory: 2Gi
  service:
    type: LoadBalancer
    cookedPort: 39998
    uncookedPort: 39997
  upstreamQueueSize: "10000"
  classifyUrl: "" # default: http://{{ fullname }}-classify:8080

dlqExporter:
  enabled: true
  image: splash-dlq-exporter:latest
  port: 9102

indexLagProbe:
  enabled: true
  image: splash-index-lag-probe:latest
  port: 9103
  # Poll interval seconds; compares s2s events_emitted rate vs ES _count delta.
  intervalSeconds: "15"
  # Comma-separated s2s health URLs (in-cluster). Empty = headless pipeline pods.
  s2sHealthUrls: ""

ingestBind: "0.0.0.0"
