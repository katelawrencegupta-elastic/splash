# Prometheus / Alertmanager rules for Splash
#
# Load with PrometheusRule (kube-prometheus) or as a classic rules file.
# Also load deploy/alerts/splash-recording.yaml for derived series.
# Metric names match /metrics on s2s-decode (:8081), classify (:8080),
# dlq_exporter (:9102), and index_lag_probe (:9103).

groups:
  - name: splash
    rules:
      - alert: SplashS2SQueuePegged
        expr: splash_s2s_upstream_queue > 9000
        for: 2m
        labels:
          severity: critical
          service: splash
        annotations:
          summary: "Splash s2s-decode upstream queue pegged"
          description: >-
            upstream_queue={{ $value }} on {{ $labels.instance }}.
            Logstash/ES is behind; Splunk will back-pressure. See docs/runbooks/alerting.md.

      - alert: SplashClassifyNotReady
        expr: splash_pipelines_ready == 0
        for: 2m
        labels:
          severity: critical
          service: splash
        annotations:
          summary: "Splash classify frosty pipelines not ready"
          description: >-
            pipelines_ready=0 on {{ $labels.instance }}.
            Install frosty-parse-* or set FROSTY_PIPELINE_MODE=stub for POC only.

      - alert: SplashDLQGrowing
        expr: delta(splash_dlq_bytes_total[15m]) > 0
        for: 15m
        labels:
          severity: warning
          service: splash
        annotations:
          summary: "Splash Logstash DLQ is growing"
          description: >-
            DLQ bytes increased over 15m on {{ $labels.instance }}.
            Investigate ES bulk failures; see docs/runbooks/dlq.md.

      - alert: SplashIndexLagHigh
        expr: splash_index_lag_seconds > 60
        for: 10m
        labels:
          severity: warning
          service: splash
        annotations:
          summary: "Splash index lag high"
          description: >-
            Index lag {{ $value }}s on {{ $labels.instance }}.
            See docs/runbooks/alerting.md (index lag probe).

      - alert: SplashPeakToAvgHigh
        expr: splash:peak_to_avg:1d > 3
        for: 1h
        labels:
          severity: warning
          service: splash
        annotations:
          summary: "Splash ingest peak/avg ratio high"
          description: >-
            peak_to_avg={{ $value }} over 1d. Daily-total sizing understates need;
            re-run shards ≈ ceil(ceil(peak_GBps/0.008)×1.25) on measured peak.
            See docs/runbooks/sharding.md.

      - alert: SplashClassifyMissStorm
        expr: >
          (
            splash:miss_fraction:1m > 0.25
            or splash:classify_miss_eps:1m > 2000
          )
          and splash:ingest_eps:1m > 100
        for: 5m
        labels:
          severity: warning
          service: splash
        annotations:
          summary: "Splash classify metadata-miss storm"
          description: >-
            miss_fraction or miss_eps elevated on {{ $labels.instance }}.
            Expand classify_rules.json, check UF sourcetype/source, or scale classify.
            See docs/runbooks/alerting.md.
