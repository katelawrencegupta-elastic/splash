services:
  classify:
    build: ./sidecar
    container_name: splash-classify
    environment:
      ELASTIC_HOST: "${ELASTIC_HOST:?ELASTIC_HOST is required}"
      ELASTIC_API_KEY: "${ELASTIC_API_KEY:?ELASTIC_API_KEY is required}"
      DATA_STREAM_NAMESPACE: "${DATA_STREAM_NAMESPACE:-default}"
      FROSTY_PIPELINE_MODE: "${FROSTY_PIPELINE_MODE:-stub}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-1}"
      ELASTIC_HTTP_TIMEOUT_S: "${ELASTIC_HTTP_TIMEOUT_S:-2.0}"
      ELASTIC_ENSURE_CONCURRENCY: "${ELASTIC_ENSURE_CONCURRENCY:-8}"
      CLASSIFY_AUTH_TOKEN: "${CLASSIFY_AUTH_TOKEN:-splash-dev-classify-token}"
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  logstash:
    build: ./logstash
    container_name: splash-logstash
    # Bind to loopback by default so host-published ingest is not world-reachable.
    # For remote Splunk forwarders set INGEST_BIND=0.0.0.0 in .env.
    ports:
      - "${INGEST_BIND:-127.0.0.1}:39997:39997"
    expose:
      - "39996"
    environment:
      ELASTIC_HOST: "${ELASTIC_HOST:?ELASTIC_HOST is required}"
      ELASTIC_API_KEY: "${ELASTIC_API_KEY:?ELASTIC_API_KEY is required}"
      CLASSIFY_URL: "http://classify:8080"
      CLASSIFY_BATCH_SIZE: "${CLASSIFY_BATCH_SIZE:-100}"
      CLASSIFY_FLUSH_MS: "${CLASSIFY_FLUSH_MS:-200}"
      CLASSIFY_MAX_BUFFER: "${CLASSIFY_MAX_BUFFER:-5000}"
      CLASSIFY_MAX_EGRESS: "${CLASSIFY_MAX_EGRESS:-5000}"
      CLASSIFY_MESSAGE_PREFIX_BYTES: "${CLASSIFY_MESSAGE_PREFIX_BYTES:-512}"
      CLASSIFY_HTTP_POOL: "${CLASSIFY_HTTP_POOL:-4}"
      CLASSIFY_AUTH_TOKEN: "${CLASSIFY_AUTH_TOKEN:-splash-dev-classify-token}"
      DATA_STREAM_NAMESPACE: "${DATA_STREAM_NAMESPACE:-default}"
      # 512m is tight under batch classify + ES bulk; override via LS_JAVA_OPTS if needed.
      LS_JAVA_OPTS: "${LS_JAVA_OPTS:--Xms1g -Xmx1g}"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/scripts:/usr/share/logstash/scripts:ro
      # Canonical rules live in sidecar/; overlay so Logstash and classify stay in sync.
      - ./sidecar/classify_rules.json:/usr/share/logstash/scripts/classify_rules.json:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      classify:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9600/_node/stats >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  # Owns cooked S2S on 39998 (mutually exclusive with logstash-input-s2s).
  s2s-decode:
    build: ./s2s
    container_name: splash-s2s-decode
    ports:
      - "${INGEST_BIND:-127.0.0.1}:39998:39998"
    expose:
      - "8081"
    environment:
      S2S_LISTEN_HOST: "0.0.0.0"
      S2S_LISTEN_PORT: "39998"
      LOGSTASH_HOST: "logstash"
      LOGSTASH_DECODED_PORT: "39996"
      S2S_HEALTH_PORT: "8081"
      S2S_UPSTREAM_QUEUE_SIZE: "${S2S_UPSTREAM_QUEUE_SIZE:-10000}"
      S2S_UPSTREAM_BATCH_SIZE: "${S2S_UPSTREAM_BATCH_SIZE:-100}"
      S2S_UPSTREAM_FLUSH_MS: "${S2S_UPSTREAM_FLUSH_MS:-50}"
      S2S_UPSTREAM_DRAIN_TIMEOUT_S: "${S2S_UPSTREAM_DRAIN_TIMEOUT_S:-30}"
      LOG_LEVEL: "INFO"
    depends_on:
      logstash:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Optional Prometheus scrape for Logstash DLQ depth (same volume as logstash).
  dlq-exporter:
    build: ./deploy/dlq_exporter
    container_name: splash-dlq-exporter
    profiles: ["metrics"]
    environment:
      DLQ_PATH: "/usr/share/logstash/data/dead_letter_queue"
      LISTEN_PORT: "9102"
    ports:
      - "${INGEST_BIND:-127.0.0.1}:${DLQ_EXPORTER_HOST_PORT:-9102}:9102"
    volumes:
      - logstash_data:/usr/share/logstash/data:ro
    depends_on:
      - logstash
    restart: unless-stopped

  index-lag-probe:
    build: ./deploy/index_lag_probe
    container_name: splash-index-lag-probe
    profiles: ["metrics"]
    environment:
      ELASTIC_HOST: "${ELASTIC_HOST:?ELASTIC_HOST is required}"
      ELASTIC_API_KEY: "${ELASTIC_API_KEY:?ELASTIC_API_KEY is required}"
      DATA_STREAM_NAMESPACE: "${DATA_STREAM_NAMESPACE:-default}"
      S2S_HEALTH_URLS: "http://s2s-decode:8081/health"
      INTERVAL_SECONDS: "${INDEX_LAG_INTERVAL_SECONDS:-15}"
      LISTEN_PORT: "9103"
    ports:
      - "${INGEST_BIND:-127.0.0.1}:${INDEX_LAG_HOST_PORT:-9103}:9103"
    depends_on:
      - s2s-decode
    restart: unless-stopped

  # Scrapes Splash /metrics and remote_writes to Elastic Cloud Prometheus API.
  prometheus:
    build: ./deploy/prometheus
    container_name: splash-prometheus
    profiles: ["metrics"]
    environment:
      ELASTIC_HOST: "${ELASTIC_HOST:?ELASTIC_HOST is required}"
      ELASTIC_API_KEY: "${ELASTIC_API_KEY:-}"
      # Prefer a metrics-* scoped key; falls back to ELASTIC_API_KEY with a warning.
      PROMETHEUS_ELASTIC_API_KEY: "${PROMETHEUS_ELASTIC_API_KEY:-}"
      # Optional override; default is ${ELASTIC_HOST}/_prometheus/api/v1/write
      PROMETHEUS_REMOTE_WRITE_URL: "${PROMETHEUS_REMOTE_WRITE_URL:-}"
      SPLASH_SHARD_ID: "${SPLASH_SHARD_ID:-0}"
    ports:
      - "${INGEST_BIND:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./deploy/alerts/splash-alerts.yaml:/etc/prometheus/rules/splash-alerts.yaml:ro
      - ./deploy/alerts/splash-recording.yaml:/etc/prometheus/rules/splash-recording.yaml:ro
      - prometheus_data:/prometheus
    depends_on:
      - s2s-decode
      - classify
      - dlq-exporter
      - index-lag-probe
    restart: unless-stopped

volumes:
  logstash_data:
  prometheus_data:
